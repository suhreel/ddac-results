name: Scrape results

on:
  schedule:
    - cron: "7,27,47 * * * *"    # every 20 minutes
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources (comma-separated, blank = all)"
        required: false
        default: ""
      since:
        description: "Backfill from date YYYY-MM-DD (blank = normal run)"
        required: false
        default: ""
      debug:
        description: "Save page HTML/screenshots as an artifact"
        type: boolean
        default: false
      email:
        description: "Send email digest"
        type: boolean
        default: true

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scrapers
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          MEMBERS_JSON: ${{ secrets.MEMBERS_JSON }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: |
          ARGS=""
          [ -n "${{ inputs.sources }}" ] && ARGS="$ARGS --sources ${{ inputs.sources }}"
          [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since ${{ inputs.since }}"
          [ "${{ inputs.email }}" = "false" ] && ARGS="$ARGS --no-email"
          python run.py $ARGS

      - name: Save debug pages
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug/
          retention-days: 7

      - name: Commit results
        run: |
          git config user.name "ddac-results-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results.json data/state.json docs/results
          git diff --cached --quiet || git commit -m "Results update $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash && git push
