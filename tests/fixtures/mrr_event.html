<!doctype html>
<html><head><title>Test event results</title></head>
<body>
<!-- Mimics a JS-paginated results page with distance tabs and a page-size selector -->
<ul class="nav nav-tabs">
  <li><a href="#" data-race="10k">10k</a></li>
  <li><a href="#" data-race="5k">5k</a></li>
</ul>
<select name="results_length"><option>10</option><option>20</option><option>50</option></select>
<table id="t"><thead><tr><th>Place ⬆</th><th>Name ⬆</th><th>Gross Time ⬆</th><th>Cat ⬆</th><th>Sub Cat ⬆</th><th>Club ⬆</th></tr></thead>
<tbody></tbody></table>
<ul class="pagination"><li><a href="#" id="prev">Previous</a></li><li id="nextli"><a href="#" id="next">Next</a></li></ul>
<script>
const clubs = ["Tullamore Harriers","Drogheda & District AC","Raheny Shamrock","Drogheda AC","Ace AC"];
const data = {};
for (const race of ["10k","5k"]) {
  data[race] = [];
  for (let i = 1; i <= 45; i++) data[race].push([i, `Runner${race}${i} SMITH #${i}`, `00:${String(30+Math.floor(i/3)).padStart(2,'0')}:${String(i%60).padStart(2,'0')}`, i%2?"M":"F", i%2?"M40":"F35", clubs[i%5]]);
}
let race = "10k", page = 0, size = 10;
function render() {
  const rows = data[race].slice(page*size, (page+1)*size);
  document.querySelector("tbody").innerHTML = rows.map(r => "<tr>" + r.map((c,j) => j==1 ? `<td><a href="/r/${r[0]}">${c}</a></td>` : `<td>${c}</td>`).join("") + "</tr>").join("");
  document.getElementById("nextli").className = (page+1)*size >= data[race].length ? "disabled" : "";
}
document.querySelectorAll("[data-race]").forEach(a => a.onclick = e => { e.preventDefault(); race = a.dataset.race; page = 0; render(); });
document.querySelector("select").onchange = e => { size = +e.target.value; page = 0; render(); };
document.getElementById("next").onclick = e => { e.preventDefault(); if ((page+1)*size < data[race].length) { page++; render(); } };
render();
</script>
</body></html>
